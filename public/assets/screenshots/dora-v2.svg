<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#09090B"/>
  
  <!-- Sidebar (Collapsed/Standard) -->
  <rect width="220" height="800" fill="#18181B"/>
  <text x="64" y="42" fill="white" font-family="sans-serif" font-size="18" font-weight="600">DevMetrics</text>
  
  <text x="52" y="106" fill="#A1A1AA" font-family="sans-serif" font-size="14" font-weight="500">Dashboard</text>
  <text x="52" y="154" fill="#A1A1AA" font-family="sans-serif" font-size="14" font-weight="500">ROI &amp; Value</text>
  <rect x="12" y="176" width="196" height="40" rx="8" fill="#27272A"/>
  <text x="52" y="202" fill="#06B6D4" font-family="sans-serif" font-size="14" font-weight="500">DORA &amp; Speed</text>
  
  <!-- Header -->
  <rect x="220" width="980" height="64" fill="#09090B" fill-opacity="0.8"/>
  <text x="244" y="40" fill="white" font-family="sans-serif" font-size="20" font-weight="600">DORA &amp; Speed</text>
  
  <!-- Content -->
  <text x="244" y="100" fill="white" font-family="sans-serif" font-size="32" font-weight="700">DORA Metrics</text>
  <text x="244" y="130" fill="#A1A1AA" font-family="sans-serif" font-size="16">Measuring software delivery performance and AI impact.</text>
  
  <rect x="244" y="160" width="300" height="160" rx="12" fill="#18181B" stroke="#27272A"/>
  <text x="264" y="190" fill="#A1A1AA" font-family="sans-serif" font-size="14">Deployment Frequency</text>
  <text x="264" y="240" fill="white" font-family="sans-serif" font-size="36" font-weight="700">12.4</text>
  <text x="264" y="265" fill="#A1A1AA" font-family="sans-serif" font-size="12">deployments / week</text>
  <text x="264" y="295" fill="#4ADE80" font-family="sans-serif" font-size="14" font-weight="600">Elite Performer</text>

  <rect x="564" y="160" width="300" height="160" rx="12" fill="#18181B" stroke="#27272A"/>
  <text x="584" y="190" fill="#A1A1AA" font-family="sans-serif" font-size="14">Lead Time for Changes</text>
  <text x="584" y="240" fill="white" font-family="sans-serif" font-size="36" font-weight="700">4.2h</text>
  <text x="584" y="265" fill="#A1A1AA" font-family="sans-serif" font-size="12">AI Session to Merge</text>
  <text x="584" y="295" fill="#4ADE80" font-family="sans-serif" font-size="14" font-weight="600">Elite Performer</text>

  <rect x="884" y="160" width="272" height="160" rx="12" fill="#18181B" stroke="#27272A"/>
  <text x="904" y="190" fill="#A1A1AA" font-family="sans-serif" font-size="14">Change Failure Rate</text>
  <text x="904" y="240" fill="white" font-family="sans-serif" font-size="36" font-weight="700">2.1%</text>
  <text x="904" y="265" fill="#A1A1AA" font-family="sans-serif" font-size="12">bug fix ratio</text>
  <text x="904" y="295" fill="#4ADE80" font-family="sans-serif" font-size="14" font-weight="600">Elite Performer</text>
  
  <rect x="244" y="344" width="912" height="400" rx="12" fill="#18181B" stroke="#27272A"/>
  <text x="264" y="380" fill="white" font-family="sans-serif" font-size="18" font-weight="600">Deployment Activity</text>
  <!-- Bar chart bars -->
  <rect x="284" y="600" width="20" height="100" fill="#06B6D4" rx="4"/>
  <rect x="314" y="580" width="20" height="120" fill="#06B6D4" rx="4"/>
  <rect x="344" y="620" width="20" height="80" fill="#06B6D4" rx="4"/>
  <rect x="374" y="550" width="20" height="150" fill="#06B6D4" rx="4"/>
  <rect x="404" y="590" width="20" height="110" fill="#06B6D4" rx="4"/>
</svg>
